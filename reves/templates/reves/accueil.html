<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUREVE</title>
    <style>
        /* Base fluida e limpa */
        html, body { 
            overflow-x: hidden; 
            min-height: 100vh; 
            margin: 0; 
            padding: 0; 
            background: #f9fafb; 
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #111827; /* Escrita em preto/escuro */
            /* Fundo degradê sutil que puxa para o laranja muito claro no fundo */
            background: radial-gradient(circle at top, #ffffff 0%, #fff7ed 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Cartão de Luxo Centrado */
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: #ffffff; /* Fundo branco puro para limpeza */
            border-radius: 24px;
            border: 2px solid #facc15; /* Borda Dourada */
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.08); /* Sombra suave laranja */
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Títulos com toque dourado escuro / preto */
        h1 { font-weight: 800; font-size: 2.6rem; letter-spacing: -1px; margin: 0 0 8px 0; color: #111827; }
        .tagline { color: #4b5563; font-size: 1.05rem; margin: 0 0 40px 0; }

        /* Botões largos, ergonómicos e táteis */
        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-nav {
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            font-size: 1rem;
            display: block;
            box-sizing: border-box;
            border: none;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        /* Botão Principal: Laranja com escrita preta */
        .btn-main { 
            background: #f97316; 
            color: #000000; 
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
        }
        .btn-main:hover { background: #ea580c; }
        
        /* Botão Secundário: Fundo claro, borda laranja, escrita preta */
        .btn-sec { 
            background: #f9fafb; 
            color: #000000; 
            border: 2px solid #f97316; 
        }
        .btn-sec:hover { background: #ffffff; border-color: #ea580c; }
        
        /* Botão Premium: Dourado com escrita preta */
        .btn-prem { 
            background: #eab308; 
            color: #000000; 
            font-weight: 800;
            width: 100%; 
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
        }
        .btn-prem:hover { background: #ca8a04; }

        /* Feedback de clique imediato para telemóveis */
        .btn-nav:active { transform: scale(0.97); }

        /* Bloco de Subscrição */
        .premium-zone {
            margin-top: 40px;
            padding: 24px 20px;
            background: #fffbec; /* Fundo ouro suave */
            border-radius: 20px;
            border: 1px dashed #eab308;
        }

        .user-info { color: #b45309; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem; }
        
        .logout-form { margin-top: 15px; }
        .logout-btn { background: none; border: none; color: #dc2626; font-size: 0.9rem; font-weight: 600; cursor: pointer; opacity: 0.85; transition: opacity 0.2s; }
        .logout-btn:hover { opacity: 1; text-decoration: underline; }

        @media (max-width: 380px) {
            .app-container { padding: 25px 15px; border-radius: 20px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>NUREVE 🌙</h1>
        <p class="tagline">Gardez trace de vos nuits</p>

        <div class="btn-box">
            {% if user.is_authenticated %}
                <div class="user-info">Bonjour, {{ user.username }} ✨</div>
                
                <a href="{% url 'nouveau_reve' %}" class="btn-nav btn-main">✍️ Écrire un rêve</a>
                <a href="{% url 'mes_reves' %}" class="btn-nav btn-sec">📖 Mon Journal</a>
                <a href="{% url 'espace_public' %}" class="btn-nav btn-sec">🌍 Espace Public</a>
                
                <form action="{% url 'logout' %}" method="post" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Se déconnecter</button>
                </form>

            {% else %}
                <a href="{% url 'login' %}" class="btn-nav btn-main">Connexion</a>
                <a href="{% url 'signup' %}" class="btn-nav btn-sec">S'inscrire</a>
                <a href="{% url 'espace_public' %}" class="btn-nav btn-sec">Espace Public</a>
            {% endif %}
        </div>

        <div class="premium-zone">
            <a href="{% url 'abonnement' %}" class="btn-nav btn-prem">⭐ Mode Premium (3$)</a>
            <p style="font-size: 0.85rem; margin-top: 12px; color: #4b5563; margin-bottom: 0; line-height: 1.4; font-weight: 500;">
                Stockage illimité et badges exclusifs.
            </p>
        </div>
    </div>

</body>
</html>
