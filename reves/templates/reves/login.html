<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - NUREVE</title>
    <style>
        /* Base fluide et fond clair premium */
        html, body { 
            overflow-x: hidden; 
            min-height: 100vh; 
            margin: 0; 
            padding: 0; 
            background: #f9fafb; 
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #111827; /* Écriture en noir */
            background: radial-gradient(circle at top, #ffffff 0%, #fff7ed 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Conteneur style "Carte de Luxe" */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            background: #ffffff; /* Fond blanc pur */
            border-radius: 24px;
            border: 2px solid #facc15; /* Bordure Dorée */
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.06);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; font-size: 2.2rem; margin: 0 0 35px 0; letter-spacing: -1px; color: #111827; }

        /* Champs du formulaire générés par Django */
        form p { 
            text-align: left; 
            margin: 0 0 20px 0; 
            display: flex;
            flex-direction: column;
        }
        
        form label { 
            display: block; 
            font-size: 0.85rem; 
            color: #b45309; /* Labels en doré foncé lisible */
            margin-bottom: 8px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        form input { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: 2px solid #e5e7eb; 
            background: #f9fafb; 
            color: #000000; /* Texte tapé par l'utilisateur en noir */
            font-size: 1rem;
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }
        form input:focus { 
            outline: none; 
            border-color: #f97316; /* Focus orange */
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        /* Bloc d'erreurs en cas de mauvaise saisie */
        .errorlist {
            padding: 12px 16px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #dc2626;
            border-radius: 12px;
            list-style: none;
            text-align: left;
            font-size: 0.85rem;
            margin: 0 0 20px 0;
        }
        .errorlist li { margin: 0; }

        /* Bouton de connexion : Orange avec texte noir */
        .btn-submit {
            background: #f97316;
            color: #000000;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            transition: transform 0.1s ease, background-color 0.2s;
            box-sizing: border-box;
        }
        .btn-submit:hover { background: #ea580c; }
        .btn-submit:active { transform: scale(0.97); }

        /* Liens de bas de page */
        .footer-link { 
            margin-top: 25px; 
            display: block; 
            color: #4b5563; 
            text-decoration: none; 
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-link strong { color: #f97316; } /* Lien d'inscription mis en valeur en orange */
        .footer-link:hover { color: #000000; }

        /* Ajustements spécifiques sur mobile */
        @media (max-width: 440px) {
            body { padding: 10px; }
            .login-container { padding: 30px 20px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Connexion 🌙</h1>
        
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <a href="{% url 'signup' %}" class="footer-link">
            Pas encore de compte ? <strong>S'inscrire</strong>
        </a>
        
        <a href="{% url 'accueil' %}" class="footer-link" style="margin-top: 15px; font-size: 0.85rem; opacity: 0.8;">
            ← Retour à l'accueil
        </a>
    </div>

</body>
</html>
