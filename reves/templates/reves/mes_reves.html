<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal - NUREVE</title>
    <style>
        /* Reset fluído e fundo dinâmico */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #111827; 
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, #111827 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Contentor adaptável com espaço extra no fundo para o botão */
        .journal-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 20px 100px 20px; /* 100px garante que o botão nunca tape o texto */
            box-sizing: border-box;
            position: relative;
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        h1 { font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -0.5px; }

        .btn-back {
            text-decoration: none;
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .btn-back:hover { color: white; }

        /* Cartões de Sonho com efeito de vidro e quebra automática */
        .reve-card {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .reve-card h3 { 
            color: #818cf8; 
            font-size: 1.2rem; 
            font-weight: 700; 
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        .reve-card p { 
            color: #e5e7eb; 
            font-size: 1rem; 
            line-height: 1.6; 
            margin: 0 0 14px 0; 
            word-wrap: break-word; /* Evita que textos longos quebrem o layout */
        }

        .reve-date { 
            display: block;
            color: #6b7280; 
            font-size: 0.75rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-msg {
            text-align: center;
            margin-top: 80px;
            color: #6b7280;
            line-height: 1.5;
        }

        /* Botão Flutuante Inteligente (Responsivo) */
        .btn-add {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 230px); /* Alinha com a borda do container no PC */
            background: #6366f1;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
            text-decoration: none;
            z-index: 1000;
            transition: transform 0.1s ease, background 0.2s;
        }
        .btn-add:hover { background: #4f46e5; }
        .btn-add:active { transform: scale(0.93); }

        /* Ajustes específicos para ecrãs de telemóvel */
        @media (max-width: 540px) {
            .btn-add {
                right: 20px; /* Em telemóveis, cola na lateral direita de forma clássica */
            }
            .journal-container { padding: 15px 15px 90px 15px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="journal-container">
        <div class="header-box">
            <a href="{% url 'accueil' %}" class="btn-back">← Accueil</a>
            <h1>Mon Journal 📖</h1>
        </div>

        {% for r in reves %}
            <div class="reve-card">
                <h3>{{ r.titre }}</h3>
                <p>{{ r.contenu }}</p>
                <span class="reve-date">Le {{ r.date_creation|date:"d M Y" }}</span>
            </div>
        {% empty %}
            <div class="empty-msg">
                <div style="font-size: 3rem; margin-bottom: 15px;">✍️</div>
                <p>Votre journal est vide...<br>Levez-vous et notez votre premier rêve !</p>
            </div>
        {% endfor %}
    </div>

    <!-- Bouton flottant pour ajouter un rêve -->
    <a href="{% url 'nouveau_reve' %}" class="btn-add">＋</a>

</body>
</html>
