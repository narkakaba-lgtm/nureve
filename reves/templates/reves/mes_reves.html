<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal - NUREVE</title>
    <style>
        /* Base fluide et fond clair premium */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #f9fafb; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #111827; /* Écriture en noir */
        }

        body {
            background: radial-gradient(circle at top, #ffffff 0%, #fff7ed 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Conteneur adapté avec espace pour le bouton flottant */
        .journal-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 20px 100px 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        h1 { font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -0.5px; color: #111827; }

        .btn-back {
            text-decoration: none;
            color: #4b5563;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #f97316; } /* Hover orange */

        /* Cartes de Rêve : Fond Blanc Pur et Ligne Orange */
        .reve-card {
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-bottom: 4px solid #f97316; /* Ligne de base orange vif */
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.04);
            box-sizing: border-box;
        }

        /* Titre du Rêve en Doré Foncé (Or Professionnel) */
        .reve-card h3 { 
            color: #b45309; 
            font-size: 1.2rem; 
            font-weight: 700; 
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        /* Contenu du Rêve en Noir */
        .reve-card p { 
            color: #1f2937; 
            font-size: 1rem; 
            line-height: 1.6; 
            margin: 0 0 14px 0; 
            word-wrap: break-word;
        }

        .reve-date { 
            display: block;
            color: #9ca3af; 
            font-size: 0.75rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .empty-msg {
            text-align: center;
            margin-top: 80px;
            color: #4b5563;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Bouton Flutuante : Orange avec écriture noire */
        .btn-add {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 230px);
            background: #f97316;
            color: #000000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.35);
            text-decoration: none;
            z-index: 1000;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .btn-add:hover { background: #ea580c; }
        .btn-add:active { transform: scale(0.93); }

        /* Ajustements pour Téléphones */
        @media (max-width: 540px) {
            .btn-add {
                right: 20px;
            }
            .journal-container { padding: 15px 15px 90px 15px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="journal-container">
        <div class="header-box">
            <a href="{% url 'accueil' %}" class="btn-back">← Accueil</a>
            <h1>Mon Journal 📖</h1>
        </div>

        {% for r in reves %}
            <div class="reve-card">
                <h3>{{ r.titre }}</h3>
                <p>{{ r.contenu }}</p>
                <span class="reve-date">Le {{ r.date_creation|date:"d M Y" }}</span>
            </div>
        {% empty %}
            <div class="empty-msg">
                <div style="font-size: 3rem; margin-bottom: 15px;">✍️</div>
                <p>Votre journal est vide...<br>Levez-vous et notez votre premier rêve !</p>
            </div>
        {% endfor %}
    </div>

    <!-- Bouton flottant pour ajouter un rêve -->
    <a href="{% url 'nouveau_reve' %}" class="btn-add">＋</a>

</body>
</html>
