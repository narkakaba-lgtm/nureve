<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUREVE - Écrire un rêve</title>
    <style>
        /* Base fluide et fond clair premium */
        html, body { 
            margin: 0; 
            padding: 0;
            background: #f9fafb; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #111827; /* Écriture en noir */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #ffffff 0%, #fff7ed 100%);
            min-height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        /* Conteneur style "Carte de Luxe" */
        .write-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            background: #ffffff; /* Fond blanc pur */
            border-radius: 24px;
            border: 2px solid #facc15; /* Bordure Dorée */
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.06);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; font-size: 2rem; margin: 0 0 8px 0; letter-spacing: -1px; text-align: center; color: #111827; }
        .subtitle { color: #4b5563; font-size: 0.95rem; margin: 0 0 35px 0; text-align: center; line-height: 1.4; }

        /* Alignement des champs générés par Django */
        form p { 
            margin: 0 0 20px 0; 
            display: flex;
            flex-direction: column;
        }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #b45309; /* Doré foncé pro */
            margin-bottom: 8px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Formulaires stylisés propres et responsifs */
        input, textarea, select { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: 2px solid #e5e7eb; 
            background: #f9fafb; 
            color: #000000; /* Texte tapé en noir */
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }

        textarea { 
            min-height: 160px; 
            line-height: 1.6;
            resize: vertical;
        }

        /* Checkbox spécifique pour la visibilité publique */
        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: #f97316; /* Lueur orange */
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        /* Bouton Enregistrer : Orange avec texte noir */
        .btn-save {
            background: #f97316;
            color: #000000;
            padding: 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-sizing: border-box;
        }
        .btn-save:hover { background: #ea580c; }
        .btn-save:active { transform: scale(0.97); }

        .back-link { 
            margin-top: 25px; 
            display: block; 
            color: #4b5563; 
            text-decoration: none; 
            font-size: 0.95rem;
            text-align: center;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link:hover { color: #f97316; }

        /* Ajustements pour mobile */
        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            .write-container { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 1.7rem; }
            textarea { min-height: 140px; }
        }
    </style>
</head>
<body>

    <div class="write-container">
        <h1>Raconte ton rêve... 🌙</h1>
        <p class="subtitle">Chaque détail compte avant qu'il ne s'évapore.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn-save">Enregistrer dans mon journal</button>
        </form>

        <a href="{% url 'mes_reves' %}" class="back-link">
            ← Annuler et revenir
        </a>
    </div>

    <script>
        window.onload = function() {
            var textareas = document.getElementsByTagName('textarea');
            for(var i=0; i<textareas.length; i++) {
                textareas[i].placeholder = "Décris ton aventure ici...";
            }
            var inputs = document.getElementsByTagName('input');
            for(var j=0; j<inputs.length; j++) {
                if(inputs[j].type === 'text') {
                    inputs[j].placeholder = "Titre de ton rêve";
                }
            }
        };
    </script>
</body>
</html>
