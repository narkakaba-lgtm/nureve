<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - NUREVE</title>
    <style>
        /* Base fluida e unificada com o ecra inicial */
        html, body { 
            margin: 0; 
            padding: 0;
            background: #111827; 
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e1b4b 0%, #111827 100%);
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Contentor adaptável com efeito Glassmorphism */
        .signup-container {
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; font-size: 2rem; margin: 0 0 8px 0; letter-spacing: -1px; }
        .subtitle { color: #9ca3af; font-size: 0.95rem; margin: 0 0 35px 0; line-height: 1.4; }

        /* Estilização dos blocos de formulário gerados pelo Django */
        form p { 
            text-align: left; 
            margin: 0 0 24px 0; 
            display: flex;
            flex-direction: column;
        }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #818cf8; 
            margin-bottom: 8px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Inputs 100% responsivos */
        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.04); 
            color: white;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box; /* IMPORTANTE: Impede o campo de quebrar o ecra */
            transition: all 0.2s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #6366f1; 
            background: rgba(255, 255, 255, 0.08); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Textos de ajuda do Django (Regras de palavra-passe) */
        .helptext { 
            display: block; 
            font-size: 0.8rem; 
            color: #9ca3af; /* Cor mais clara para melhor leitura */
            margin-top: 8px; 
            line-height: 1.4;
            padding-left: 2px;
        }

        /* Lista de Erros de Validação Estilizada */
        .errorlist {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-radius: 12px;
            list-style: none;
            text-align: left;
            font-size: 0.85rem;
            margin: 0 0 15px 0;
        }
        .errorlist li { margin: 0; }

        /* Botão largo e tátil */
        .btn-submit {
            background: #6366f1;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            transition: transform 0.1s ease, background 0.2s;
            box-sizing: border-box;
        }
        .btn-submit:hover { background: #4f46e5; }
        .btn-submit:active { transform: scale(0.97); }

        /* Links de navegação inferiores */
        .footer-link { 
            margin-top: 25px; 
            display: block; 
            color: #9ca3af; 
            text-decoration: none; 
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .footer-link strong { color: #818cf8; }
        .footer-link:hover { color: white; }

        /* Media Query para ecrãs pequenos */
        @media (max-width: 480px) {
            body { padding: 20px 10px; }
            .signup-container { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h1>Rejoindre NUREVE 🌙</h1>
        <p class="subtitle">Commencez à archiver vos nuits dès maintenant.</p>
        
        <form method="post">
            {% csrf_token %}
            
            {# O Django desenha os campos, ajudas e erros aqui de forma limpa #}
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>

        <a href="{% url 'login' %}" class="footer-link">
            Déjà inscrit ? <strong>Se connecter</strong>
        </a>
        
        <a href="{% url 'accueil' %}" class="footer-link" style="margin-top: 15px; font-size: 0.85rem; opacity: 0.7;">
            ← Retour à l'accueil
        </a>
    </div>

</body>
</html>
