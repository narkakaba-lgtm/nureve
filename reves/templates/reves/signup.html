<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - NUREVE</title>
    <style>
        /* Base fluide et fond clair premium */
        html, body { 
            margin: 0; 
            padding: 0;
            background: #f9fafb; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #111827; /* Écriture en noir */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #ffffff 0%, #fff7ed 100%);
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Conteneur style "Carte de Luxe" */
        .signup-container {
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            text-align: center;
            background: #ffffff; /* Fond blanc pur */
            border-radius: 24px;
            border: 2px solid #facc15; /* Bordure Dorée */
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.06);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; font-size: 2rem; margin: 0 0 8px 0; letter-spacing: -1px; color: #111827; }
        .subtitle { color: #4b5563; font-size: 0.95rem; margin: 0 0 35px 0; line-height: 1.4; }

        /* Alignement des éléments du formulaire Django */
        form p { 
            text-align: left; 
            margin: 0 0 24px 0; 
            display: flex;
            flex-direction: column;
        }
        
        form label { 
            display: block; 
            font-size: 0.85rem; 
            color: #b45309; /* Doré foncé haut de gamme et lisible */
            margin-bottom: 8px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Champs de saisie 100% fluides */
        form input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 14px; 
            border: 2px solid #e5e7eb; 
            background: #f9fafb; 
            color: #000000; /* Texte tapé par l'utilisateur en noir */
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        form input:focus { 
            outline: none; 
            border-color: #f97316; /* Lueur orange vif */
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        /* Consignes de sécurité de mot de passe générées par Django */
        .helptext { 
            display: block; 
            font-size: 0.8rem; 
            color: #4b5563; /* Gris foncé pour une excellente lecture sur fond blanc */
            margin-top: 8px; 
            line-height: 1.4;
            padding-left: 2px;
        }

        /* Liste des erreurs de validation (ex: mots de passe différents) */
        .errorlist {
            padding: 12px 16px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #dc2626;
            border-radius: 12px;
            list-style: none;
            text-align: left;
            font-size: 0.85rem;
            margin: 0 0 15px 0;
        }
        .errorlist li { margin: 0; }

        /* Bouton de validation : Orange avec texte noir */
        .btn-submit {
            background: #f97316;
            color: #000000;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            transition: transform 0.1s ease, background-color 0.2s;
            box-sizing: border-box;
        }
        .btn-submit:hover { background: #ea580c; }
        .btn-submit:active { transform: scale(0.97); }

        /* Liens de bas de page */
        .footer-link { 
            margin-top: 25px; 
            display: block; 
            color: #4b5563; 
            text-decoration: none; 
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .footer-link strong { color: #f97316; } /* Lien de connexion en orange */
        .footer-link:hover { color: #000000; }

        /* Optimisations pour petits écrans */
        @media (max-width: 480px) {
            body { padding: 20px 10px; }
            .signup-container { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h1>Rejoindre NUREVE 🌙</h1>
        <p class="subtitle">Commencez à archiver vos nuits dès maintenant.</p>
        
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>

        <a href="{% url 'login' %}" class="footer-link">
            Déjà inscrit ? <strong>Se connecter</strong>
        </a>
        
        <a href="{% url 'accueil' %}" class="footer-link" style="margin-top: 15px; font-size: 0.85rem; opacity: 0.8;">
            ← Retour à l'accueil
        </a>
    </div>

</body>
</html>
